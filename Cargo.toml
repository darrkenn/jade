[package]
name = "Jade"
version = "0.1.0"
edition = "2024"

[dependencies]
crossterm = "0.29.0"
ratatui = { version = "0.30.0", default-features = true, features = ["serde"]}
color-eyre = "0.6.5"
serde = { version = "1.0.228", features = ["derive"] }
toml = "1.0.7"

[profile.dev]
opt-level = 0
debug = true
split-debuginfo = "unpacked"
lto = false
incremental = true
codegen-units = 32

[profile.release]
opt-level = 3
debug = false
strip = true
debug-assertions = false
overflow-checks = false
lto = "fat"
panic = "abort"
incremental = false
codegen-units = 1
rpath = false
